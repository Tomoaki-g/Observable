name: ObservableLab
options:
  bundleIdPrefix: com.tomoaki-g
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  ObservableLab:
    type: application
    platform: iOS
    sources: [ObservableLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomoaki-g.ObservableLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  ObservableLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ObservableLabTests]
    dependencies:
      - target: ObservableLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ObservableLab:
    build:
      targets:
        ObservableLab: all
    test:
      targets: [ObservableLabTests]
